# Tests on every push by a person and every pull request, and a build of the
# site from data/ without the checker (as Cloudflare Pages builds it). The
# daily data commits are pushed with the workflow token, which starts no
# workflow; the daily job runs the tests and the same build itself before it
# pushes, and Cloudflare Pages builds those commits.

name: test

on:
  push:
  pull_request:

env:
  # The public checker at the same pinned commit as daily-scan.yml.
  CHECKER_REPOSITORY: bcrypto0/addon-declaration
  CHECKER_SHA: f65cc456142f4a204d4ceda1b7141a52ca1ececc

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
          persist-credentials: false

      - name: Check out the public checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CHECKER_REPOSITORY }}
          ref: ${{ env.CHECKER_SHA }}
          path: checker
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node }}

      - name: Test
        run: node --test
        env:
          DECLARED_CHECKER_DIR: ${{ github.workspace }}/checker

      - name: Build the site without the checker
        run: |
          node build/build.js
          test -f dist/index.html
          test -f dist/_headers
